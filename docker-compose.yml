services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: simply_apply
      POSTGRES_USER: simply
      POSTGRES_PASSWORD: simply
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simply -d simply_apply"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
