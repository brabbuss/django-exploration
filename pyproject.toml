[project]
name = "simply-apply"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.7.0",
    "django>=6.1.3",
    "djangorestframework>=3.18.3",
    "psycopg[binary]>=3.3.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
